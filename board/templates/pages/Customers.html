{% extends 'base.html' %}

{% block content %}
    <div class="segment-toolbar">
        <div class="segment-heading">
            <h5 class="segment-title">Main Profiles of Customers</h5>
        </div>
    </div>
    <div class="container-fluid">
        <section class="analysis-row-radars">
            <div class="analysis-card">
                <div class="chart-loader" id="loader-radar1">
                    <div class="spinner"></div>
                    <p>Loading ...</p>
                </div>
                <div id="radar1cat1" class="chart-canvas"></div>
            </div>
            <div class="analysis-card">
                <div class="chart-loader" id="loader-radar2">
                    <div class="spinner"></div>
                    <p>Loading ...</p>
                </div>
                <div id="radar2cat1" class="chart-canvas"></div>
            </div>
        </section>
        <section class="analysis-row-radars">
            <div class="analysis-card">
                <div class="chart-loader" id="loader-radar3">
                    <div class="spinner"></div>
                    <p>Loading ...</p>
                </div>
                <div id="radar3cat1" class="chart-canvas"></div>
            </div>
            <div class="analysis-card">
                <div class="chart-loader" id="loader-radar4">
                    <div class="spinner"></div>
                    <p>Loading ...</p>
                </div>
                <div id="radar4cat1" class="chart-canvas"></div>
            </div>
        </section>
        <section class="charts-grid">
            <div class="mini-chart-card">
                <div id="customer-chart1" class="chart-canvas"></div>
                <div class="mini-chart-desc">
                    <h6>Customers Eye Color</h6>
                </div>
            </div>
            <div class="mini-chart-card">
                <div id="customer-chart2" class="chart-canvas"></div>
                <div class="mini-chart-desc">
                    <h6>Customers Age</h6>
                </div>
            </div>
            <div class="mini-chart-card">
                <div id="customer-chart3" class="chart-canvas"></div>
                <div class="mini-chart-desc">
                    <h6>Customers Hair Condition</h6>
                </div>
            </div>
            <div class="mini-chart-card">
                <div id="customer-chart4" class="chart-canvas"></div>
                <div class="mini-chart-desc">
                    <h6>Customers Skin Tone</h6>
                </div>
            </div>
            <div class="mini-chart-card">
                <div id="customer-chart5" class="chart-canvas"></div>
                <div class="mini-chart-desc">
                    <h6>Customers Skin Type</h6>
                </div>
            </div>
        </section>
    </div>
{% endblock %}
