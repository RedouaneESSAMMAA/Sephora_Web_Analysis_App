{% extends 'base.html' %}

{% block content %}
    <div class="container-fluid">
        <section class="analysis-row">
            <div class="heatmaps-wrapper">
                <div class="chart-loader" id="loader-heatmaps">
                    <div class="spinner"></div>
                    <p>Loading...</p>
                </div>
                <div class="analysis-card">
                    <div id="new-old-rev" class="chart-canvas"></div>
                </div>
                <div class="analysis-card">
                    <div id="new-old-rat" class="chart-canvas"></div>
                </div>
            </div>
        </section>
        <section class="wordcloud-section">
            <div class="wordcloud-card">
                <img src="/static/wordcloud.png" alt="Wordcloud of customer review keywords">
                <h6>Top Keywords in Customer Reviews</h6>
            </div>
        </section>
    </div>
{% endblock %}
