<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='CSS/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.8.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
    <script defer src="{{ url_for('static', filename='JS/charts.js') }}"></script>
    <script defer src="{{ url_for('static', filename='JS/customer.js') }}"></script>
    <script defer src="{{ url_for('static', filename='JS/support.js') }}"></script>
</head>
<body>
    <div class="container">
        <!-- Sidebar inclusion -->
        {% include '_navigation.html' %}

        <!-- Main content -->
        <main class="main-content">
            <!-- Top navbar: navigate between pages -->
            <nav class="top-navbar">
                <ul class="top-navbar-list">
                    <li><a href="/" class="top-nav-link {% if request.path == '/' %}active{% endif %}"><i class="fa-solid fa-chart-pie"></i>Overview</a></li>
                    <li><a href="/customers" class="top-nav-link {% if request.path == '/customers' %}active{% endif %}"><i class="bi bi-people-fill"></i> Customers</a></li>
                </ul>
            </nav>

            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
